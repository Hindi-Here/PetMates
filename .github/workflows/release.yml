name: Release All Platforms
on:
  push:
    tags:
      - 'v*'

jobs:

  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '' }
          - { os: ubuntu-22.04, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-latest, args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'web/src-tauri -> target'
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: web
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          projectPath: web
          tagName: ${{ github.ref_name }}
          releaseName: 'PetMates ${{ github.ref_name }}'
          args: ${{ matrix.args }}

  build-android:
    needs: build-desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'web/src-tauri -> target'
          
      - name: Point Tauri to preinstalled NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "Using NDK from: $ANDROID_NDK_HOME"
          
      - name: Install dependencies
        working-directory: web
        run: npm ci
        
      - name: Build Android APK (Debug)
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npx tauri android build --apk --debug --target aarch64
        
      - name: Show generated APK path
        run: find web/src-tauri/gen/android -name "*.apk"
        
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            web/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}